id = "kalbhor.usage"
name = "Subscription Usage"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Show coding-agent subscription usage limits (Claude Code, Codex) in a popup."
platforms = ["linux", "macos"]

[[panes]]
id = "usage"
title = "Subscription usage"
placement = "popup"
width = "70%"
height = 16
command = ["python3", "herdr_usage.py", "watch"]

[[actions]]
id = "open"
title = "Show subscription usage"
command = ["python3", "herdr_usage.py", "open"]
